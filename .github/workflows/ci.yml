name: Standard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Checkout idle engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/idle
        path: idle

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cargo rustc \
          libwayland-dev libxkbcommon-dev libudev-dev \
          libdbus-1-dev pkg-config libssl-dev \
          libfontconfig1-dev libfreetype6-dev \
          libclang-dev clang \
          ffmpeg

    - name: Verify sibling `idle/` checkout (path-dep)
      run: |
        # `idle-cosmic` declares path-deps on `idle/crates/*`. The
        # `actions/checkout` step above materializes the engine at idle/;
        # fail fast with a clear message if it is missing.
        if [ ! -f idle/Cargo.toml ]; then
          echo "::error::idle/Cargo.toml missing — the idle engine checkout step failed"
          exit 1
        fi

    - name: cargo build
      run: cargo build --workspace --all-targets

    - name: cargo test
      run: cargo test --workspace --all-targets

    - name: cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: cargo audit (advisories)
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf \
          https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        cargo binstall -y cargo-audit
        cargo audit --ignore RUSTSEC-2026-0253 --ignore RUSTSEC-2026-0186

    - name: cargo fmt check
      run: cargo fmt --all -- --check