name: Standard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deps: ""
          - runner: ubuntu-24.04
            deps: libdbus-1-dev pkg-config libssl-dev

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cargo rustc \
          libwayland-dev libxkbcommon-dev libudev-dev \
          libdbus-1-dev pkg-config libssl-dev \
          libfontconfig1-dev libfreetype6-dev \
          libclang-dev clang \
          ffmpeg

    - name: Symlink sibling `idle/` checkout (path-dep)
      run: |
        # `idle-cosmic` declares a path-dep on `idle/`. The upstream
        # checkouts split `idle/` into its own repo, so symlink for
        # the local Cargo workspace to resolve.
        if [ -d idle ] && [ ! -e idle/Cargo.toml ]; then
          echo "::error::idle/ is a non-Cargo directory; expected sibling checkout"
          exit 1
        fi

    - name: cargo build
      run: cargo build --workspace --all-targets

    - name: cargo test
      run: cargo test --workspace --all-targets

    - name: cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: cargo fmt check
      run: cargo fmt --all -- --check