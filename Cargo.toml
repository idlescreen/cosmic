[package]
name = "trance-applet"
version = "1.0.30"
edition = "2024"
license = "Apache-2.0"
description = "COSMIC Desktop panel applet for IdleScreen (Wayland idle/screensaver daemon)"
repository = "https://github.com/idlescreen/idle-cosmic"
publish = false

[dependencies]
anyhow = "1"
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52", features = ["full"] }
libc = "0.2"
trance-dbus = { path = "../idlescreen/crates/trance-dbus" }
trance-runner = { path = "../idlescreen/trance-runner" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "ef162b8e"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[package.metadata.deb]
name = "trance-applet"
changelog = "debian/changelog"
copyright = "2026 IdleScreen"
maintainer = "idlescreen <jerydleuck@gmail.com>"
extended-description = "Native System76 COSMIC Desktop panel applet for the IdleScreen (trance) screensaver daemon. Optional: install only on COSMIC."
depends = "libc6, trance"
enhances = "cosmic-session, cosmic-panel"
section = "utils"
priority = "optional"
assets = [
    ["target/release/trance-applet", "usr/bin/trance-applet", "755"],
    ["resources/app.desktop", "usr/share/applications/com.system76.CosmicApplet.Trance.desktop", "644"],
    ["resources/app.metainfo.xml", "usr/share/metainfo/com.system76.CosmicApplet.Trance.metainfo.xml", "644"],
    ["resources/icon.png", "usr/share/pixmaps/com.system76.CosmicApplet.Trance.png", "644"],
    ["trance-applet.1", "usr/share/man/man1/trance-applet.1", "644"]
]

[package.metadata.generate-rpm]
name = "trance-applet"
release = "1"
arch = "x86_64"
summary = "COSMIC Desktop panel applet for IdleScreen"
description = "Native System76 COSMIC Desktop panel applet for the IdleScreen screensaver daemon."
license = "Apache-2.0"
assets = [
    { source = "target/release/trance-applet", dest = "/usr/bin/trance-applet", mode = "755" },
    { source = "resources/app.desktop", dest = "/usr/share/applications/com.system76.CosmicApplet.Trance.desktop", mode = "644" },
    { source = "resources/app.metainfo.xml", dest = "/usr/share/metainfo/com.system76.CosmicApplet.Trance.metainfo.xml", mode = "644" },
    { source = "resources/icon.png", dest = "/usr/share/pixmaps/com.system76.CosmicApplet.Trance.png", mode = "644" },
    { source = "trance-applet.1", dest = "/usr/share/man/man1/trance-applet.1", mode = "644" }
]

[package.metadata.generate-rpm.requires]
trance = "*"

[package.metadata.generate-rpm.supplements]
cosmic-panel = "*"
